[project]
name = "mlops-pipeline"
version = "0.1.0"
description = "Production End-to-End MLOps Pipeline: Training, MLflow Tracking, FastAPI Serving, and Drift Monitoring"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "mlflow>=2.11.0",
    "joblib>=1.3.0",
    "prometheus-client>=0.20.0",
    "scipy>=1.12.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
