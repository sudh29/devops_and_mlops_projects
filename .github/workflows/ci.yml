name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          pip install ruff

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform Formatting
        run: |
          terraform fmt -check -recursive Terraform/

  test-mlops:
    name: Test MLOps Pipeline & Serving
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MLOps Dependencies
        run: |
          cd mlops
          pip install -r requirements.txt

      - name: Generate Baseline Dataset & Run Drift Check
        run: |
          python mlops/data/generate_dataset.py
          python mlops/monitoring/drift_monitor.py

      - name: Train Model Pipeline
        run: |
          python mlops/train.py

      - name: Run MLOps Test Suite
        run: |
          cd mlops
          pytest -v tests/

  test-airflow:
    name: Test Airflow DAG Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Airflow Test Dependencies
        run: |
          pip install "apache-airflow==2.10.2" pytest

      - name: Run Airflow DAG Unit Tests
        run: |
          cd ApacheAirflow/project1
          python -m unittest test/test.py

  docker-build:
    name: Validate Container Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Flask Image
        run: |
          docker build -t test-flask Docker_and_Podman/02-flask/

      - name: Build MLOps Serving Image
        run: |
          docker build -t test-ml-serving -f mlops/serving/Dockerfile mlops/
